<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ServiceMap · Top bar preview</title><style>
*{box-sizing:border-box}body{margin:0;padding:48px 32px;background:#101612;color:#e9f5ee;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1500px;margin:auto}h1{font-size:26px;letter-spacing:-.7px;margin:0 0 10px}p{color:#8da59a;margin:0 0 40px;font-size:15px}h2{font-size:12px;text-transform:uppercase;letter-spacing:1.8px;color:#8da59a;margin:32px 0 14px}.before{display:block;width:100%;border-radius:18px}.window{border:1px solid #344438;border-radius:18px;overflow:hidden;background:#070e0a;box-shadow:0 24px 70px #0004}.titlebar{height:38px;background:#050b07;display:flex;align-items:center;gap:10px;padding:0 14px;color:#929995;font-size:15px;font-weight:650}.dot{width:14px;height:14px;border-radius:50%;background:#ff565d}.yellow{background:#ffbd09}.green{background:#1aca48}.title{margin-left:8px}.toolbar{height:88px;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:0 28px;border-bottom:1px solid #ffffff14;background:#222823}.group{display:flex;gap:4px;padding:4px;border-radius:10px;background:#0b130f;max-width:100%;overflow:auto}button{font:inherit;cursor:pointer;white-space:nowrap;border:0}.group button{border-radius:7px;padding:10px 12px;background:transparent;color:#8da59a;font-size:15px}.group button[aria-pressed=true]{background:#24533e;color:#d8fbea}.actions{display:flex;align-items:center;gap:14px}.modes{display:flex;padding:4px;background:#0b130f;border-radius:12px}.modes button{padding:11px 14px;border-radius:8px;background:transparent;color:#8da59a;font-weight:800}.modes button[aria-pressed=true]{background:#276f53;color:#c9f9df}.center{width:48px;height:48px;border-radius:14px;background:#0b130f;color:#b7ccc0;display:grid;place-items:center}.add{height:44px;border-radius:10px;background:#287a5a;color:#effbf5;padding:0 16px;font-weight:800}.canvas{height:135px;background-image:radial-gradient(#24413388 1px,transparent 1px);background-size:24px 24px}button:focus-visible{outline:2px solid #8be4b2;outline-offset:2px}.caption{margin:18px 0 0;font-size:13px}@media(max-width:760px){body{padding:26px 16px}.toolbar{height:auto;min-height:88px;flex-wrap:wrap;padding:18px;gap:16px}.group button{padding:10px 8px;font-size:13px}.actions{margin-left:auto}.canvas{height:90px}}
</style></head><body><main><h1>A cleaner top bar</h1><p>The category menu takes the logo and title’s place.</p><h2>Proposed</h2><section class="window"><div class="titlebar"><i class="dot"></i><i class="dot yellow"></i><i class="dot green"></i><span class="title">Internal Servicemap</span></div><header class="toolbar"><nav class="group" aria-label="Service categories"><button aria-pressed="true">All</button><button aria-pressed="false">Infrastructure</button><button aria-pressed="false">Integrations</button><button aria-pressed="false">Dev tools</button></nav><div class="actions"><div class="modes" aria-label="View"><button aria-pressed="true">2D</button><button aria-pressed="false">3D</button></div><button class="center" aria-label="Center map"><svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="2"><circle cx="15" cy="15" r="10"/><path d="M15 0v30M0 15h30"/></svg></button><button class="add">+ Add service</button></div></header><div class="canvas"></div></section><p class="caption">Existing ServiceMap styling · Interactive category and view controls</p><h2>Current</h2><img class="before" src="topbar-before.png" alt="Current top bar with logo and title on the left and categories beside the actions"></main><script>document.querySelectorAll('.group,.modes').forEach(g=>g.addEventListener('click',e=>{if(e.target.tagName!=='BUTTON')return;g.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===e.target)))}));</script></body></html>
